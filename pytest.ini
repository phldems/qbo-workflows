[pytest]
# Pytest configuration for QBO Workflows

# Marker definitions
markers =
    manual: Manual/diagnostic tests that require external services or user interaction
    integration: Integration tests that connect to external services (IMAP, SMTP, QuickBooks, GCP)
    unit: Unit tests that do not require external dependencies (default for unmarked tests)

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
console_output_style = progress
addopts =
    -v
    --strict-markers
    --tb=short
    -ra

# Skip manual tests by default
# To run manual tests: pytest -m manual
# To run all tests: pytest -m ""
