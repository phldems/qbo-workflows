services:
  check-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qbo-check-processor
    restart: unless-stopped

    # Environment variables from .env file
    env_file:
      - .env

    # Volumes for persistent data
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # Mount Google service account key for Vertex AI
      - ./${GOOGLE_APPLICATION_CREDENTIALS:-qbo-workflows.json}:/app/credentials.json:ro

    # Set the credentials path inside container
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Resource limits (much lower since no local ML models)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  check-tests:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["test"]
    command: ["pytest", "tests"]
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./${GOOGLE_APPLICATION_CREDENTIALS:-qbo-workflows.json}:/app/credentials.json:ro
